name: oficina-mecanica

services:
  api:
    image: oficina-mecanica-api:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oficina_mecanica_api
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: server=mysql;port=3306;database=oficina_mecanica;user=oficina_user;password=oficina_pass
      JwtSettings__Issuer: OficinaMecanica.Api
      JwtSettings__Audience: OficinaMecanica.Api
      JwtSettings__SecretKey: oficina-mecanica-tech-challenge-secret-key-2026
      AdminUserSettings__Username: admin
      AdminUserSettings__Password: Admin@123
      CORECLR_ENABLE_PROFILING: ${NEW_RELIC_ENABLED:-0}
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-}
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME:-oficina-mecanica-api}
      NEW_RELIC_DISTRIBUTED_TRACING_ENABLED: "true"
      NEW_RELIC_APPLICATION_LOGGING_ENABLED: "true"
      NEW_RELIC_APPLICATION_LOGGING_FORWARDING_ENABLED: "true"
      NEW_RELIC_APPLICATION_LOGGING_FORWARDING_CONTEXT_DATA_ENABLED: "true"
      NEW_RELIC_APPLICATION_LOGGING_LOCAL_DECORATING_ENABLED: "false"
      NEW_RELIC_LABELS: environment:local
    ports:
      - "8080:8080"
    networks:
      - oficina_mecanica_network
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: oficina_mecanica_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: oficina_mecanica
      MYSQL_USER: oficina_user
      MYSQL_PASSWORD: oficina_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - oficina_mecanica_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uoficina_user -poficina_pass --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  oficina_mecanica_network:
