name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore OficinaMecanica.Api.sln

      - name: Build
        run: dotnet build OficinaMecanica.Api.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test OficinaMecanica.Api.sln --configuration Release --no-build --verbosity normal
