name: Integracao continua

env:
  DOTNET_VERSION: 10.0.x
  TERRAFORM_VERSION: 1.15.8

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore OficinaMecanica.Api.sln

      - name: Build solution
        run: dotnet build OficinaMecanica.Api.sln --configuration Release --no-restore

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore OficinaMecanica.Api.sln

      - name: Run tests
        run: dotnet test OficinaMecanica.Api.sln --configuration Release --no-restore --verbosity normal

  terraform:
    name: Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/aws

      - name: Initialize Terraform stacks without backends
        run: |
          terraform -chdir=infra/aws/bootstrap init -backend=false -input=false
          terraform -chdir=infra/aws/platform init -backend=false -input=false
          terraform -chdir=infra/aws/workloads init -backend=false -input=false

      - name: Validate Terraform stacks
        run: |
          terraform -chdir=infra/aws/bootstrap validate -no-color
          terraform -chdir=infra/aws/platform validate -no-color
          terraform -chdir=infra/aws/workloads validate -no-color
