name: Integracao continua

env:
  DOTNET_VERSION: 10.0.x
  TERRAFORM_VERSION: 1.15.8

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore OficinaMecanica.Api.sln

      - name: Build solution
        run: dotnet build OficinaMecanica.Api.sln --configuration Release --no-restore

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore OficinaMecanica.Api.sln

      - name: Run tests
        run: dotnet test OficinaMecanica.Api.sln --configuration Release --no-restore --verbosity normal

  terraform:
    name: Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/aws/application

      - name: Initialize application Terraform without backend
        run: terraform -chdir=infra/aws/application init -backend=false -input=false

      - name: Validate application Terraform
        run: terraform -chdir=infra/aws/application validate -no-color

      - name: Validate Kong authentication chart
        run: >-
          helm lint infra/aws/application/charts/kong-auth
          --set jwt.issuer=OficinaMecanica.Api
          --set jwt.secret=abcdefghijklmnopqrstuvwxyz1234567890
